<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Website</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,Helvetica,sans-serif;
        }

        body{
            background:#f4f6f9;
            color:#222;
        }

        header{
            background:#1f2937;
            color:#fff;
            padding:20px;
            text-align:center;
        }

        nav{
            margin-top:10px;
        }

        nav a{
            color:#fff;
            text-decoration:none;
            margin:0 15px;
        }

        .hero{
            max-width:1000px;
            margin:60px auto;
            padding:40px;
            background:#fff;
            border-radius:10px;
            text-align:center;
            box-shadow:0 5px 20px rgba(0,0,0,.08);
        }

        .hero h1{
            font-size:2.5rem;
            margin-bottom:15px;
        }

        .hero p{
            color:#666;
            line-height:1.7;
            margin-bottom:25px;
        }

        .btn{
            display:inline-block;
            padding:12px 28px;
            background:#2563eb;
            color:#fff;
            text-decoration:none;
            border-radius:6px;
        }

        footer{
            text-align:center;
            padding:20px;
            color:#666;
            margin-top:60px;
        }

        @media(max-width:768px){
            .hero{
                margin:20px;
                padding:25px;
            }

            .hero h1{
                font-size:2rem;
            }
        }
    </style>
</head>
<body>

<header>
    <h2>My Website</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Professional Static Website</h1>

    <p>
        This is a simple responsive HTML and CSS website hosted on GitHub Pages.
        It is lightweight, clean, and suitable for testing deployment.
    </p>

    <a href="#" class="btn">Get Started</a>
</section>

<footer>
    © 2026 My Website. All Rights Reserved.
</footer>

</body>
</html>
