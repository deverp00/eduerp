<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Hawaipur Higher Secondary School Management System"
  >

  <meta
    name="theme-color"
    content="#2563eb"
  >

  <title>School ERP</title>

  <!-- =========================================================
       FIREBASE IMPORT MAP
       ========================================================= -->

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/analytics": "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
    }
  }
  </script>

  <!-- =========================================================
       STYLESHEET
       ========================================================= -->

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =========================================================
       MOBILE HEADER
       ========================================================= -->

  <header class="mobile-header">

    <button
      id="menuToggle"
      class="menu-toggle"
      type="button"
      aria-label="Open menu"
    >
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>

    <div class="mobile-header-title">
      <span id="mobilePageTitle">Dashboard</span>
    </div>

    <button
      id="notificationBtn"
      class="icon-btn"
      type="button"
      aria-label="Notifications"
    >
      <svg
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
    </button>

  </header>


  <!-- =========================================================
       SIDEBAR OVERLAY
       ========================================================= -->

  <div
    id="sidebarOverlay"
    class="sidebar-overlay"
    aria-hidden="true"
  ></div>


  <!-- =========================================================
       SIDEBAR
       ========================================================= -->

  <aside
    id="sidebar"
    class="sidebar"
  >

    <!-- Sidebar Header -->

    <div class="sidebar-header">

      <div class="brand">

        <div class="brand-icon">
          <svg
            width="38"
            height="38"
            viewBox="0 0 36 36"
            fill="none"
          >
            <rect
              x="2"
              y="2"
              width="32"
              height="32"
              rx="6"
              fill="#2563eb"
            />

            <rect
              x="8"
              y="8"
              width="20"
              height="20"
              rx="3"
              fill="white"
            />

            <path
              d="M13 13h10v2H13v-2Zm0 4h10v2H13v-2Zm0 4h6v2h-6v-2Z"
              fill="#2563eb"
            />
          </svg>
        </div>

        <div class="brand-text">
          <h2>School ERP</h2>
          <span>Administration</span>
        </div>

      </div>

      <button
        id="sidebarClose"
        class="sidebar-close"
        type="button"
        aria-label="Close menu"
      >
        <svg
          width="22"
          height="22"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </button>

    </div>


    <!-- =======================================================
         SIDEBAR NAVIGATION
         ======================================================= -->

    <nav class="sidebar-nav">

      <div class="nav-section">

        <span class="nav-section-title">
          Overview
        </span>

        <a
          href="#"
          class="nav-link active"
          data-page="dashboard"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
          </svg>

          <span>Dashboard</span>
        </a>

      </div>


      <div class="nav-section">

        <span class="nav-section-title">
          Management
        </span>

        <a
          href="#"
          class="nav-link"
          data-page="students"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>

          <span>Students</span>
        </a>


        <a
          href="#"
          class="nav-link"
          data-page="teachers"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>

          <span>Teachers</span>
        </a>


        <a
          href="#"
          class="nav-link"
          data-page="attendance"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <path d="M8 2v4M16 2v4M3 10h18"/>
            <path d="m8 15 2 2 5-5"/>
          </svg>

          <span>Attendance</span>
        </a>


        <a
          href="#"
          class="nav-link"
          data-page="teacher-attendance"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4"/>
            <path d="M5 21a7 7 0 0 1 14 0"/>
            <path d="m17 14 2 2 3-3"/>
          </svg>

          <span>Teacher Attendance</span>
        </a>

      </div>


      <div class="nav-section">

        <span class="nav-section-title">
          Finance
        </span>

        <a
          href="#"
          class="nav-link"
          data-page="fees"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="2" y="5" width="20" height="14" rx="2"/>
            <path d="M2 10h20"/>
            <path d="M6 15h4"/>
          </svg>

          <span>Fees</span>
        </a>


        <a
          href="#"
          class="nav-link"
          data-page="salary"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M7 8h10M7 12h6M7 16h4"/>
          </svg>

          <span>Salary</span>
        </a>


        <a
          href="#"
          class="nav-link"
          data-page="receipt"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2Z"/>
            <path d="M9 7h6M9 11h6M9 15h4"/>
          </svg>

          <span>Receipts</span>
        </a>

      </div>


      <div class="nav-section">

        <span class="nav-section-title">
          Reports
        </span>

        <a
          href="#"
          class="nav-link"
          data-page="analytics"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M4 19V5"/>
            <path d="M4 19h17"/>
            <path d="m7 15 4-4 3 2 5-6"/>
          </svg>

          <span>Analytics</span>
        </a>


        <a
          href="#"
          class="nav-link"
          data-page="export"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 3v12"/>
            <path d="m7 10 5 5 5-5"/>
            <path d="M5 21h14"/>
          </svg>

          <span>Export Data</span>
        </a>

      </div>

    </nav>


    <!-- =======================================================
         SIDEBAR FOOTER
         ======================================================= -->

    <div class="sidebar-footer">

      <div class="admin-profile">

        <div class="admin-avatar">
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21a8 8 0 0 1 16 0"/>
          </svg>
        </div>

        <div class="admin-info">
          <span
            id="adminUserName"
            class="admin-name"
          >
            Admin
          </span>

          <span class="admin-role">
            Administrator
          </span>
        </div>

      </div>


      <button
        id="logoutBtn"
        class="btn btn-secondary"
        type="button"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M10 17l5-5-5-5"/>
          <path d="M15 12H3"/>
          <path d="M21 3v18"/>
        </svg>

        <span>Logout</span>
      </button>

    </div>

  </aside>


  <!-- =========================================================
       MAIN CONTENT
       ========================================================= -->

  <main class="main-content">

    <!-- Top Bar -->

    <header class="topbar">

      <div class="topbar-left">

        <h1 id="pageTitle">
          Dashboard
        </h1>

      </div>


      <div class="topbar-right">

        <button
          id="notificationBtn"
          class="icon-btn"
          type="button"
          aria-label="Notifications"
        >
          <svg
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>

          <span class="notification-dot"></span>
        </button>

      </div>

    </header>


    <!-- =======================================================
         PAGE CONTAINER
         ======================================================= -->

    <section
      id="pageContainer"
      class="page-container"
    >

      <!-- Dashboard/pages are loaded here -->

      <div
        id="mainContent"
        class="main-page-content"
      ></div>

    </section>


    <!-- =======================================================
         FOOTER
         ======================================================= -->

    <footer class="main-footer">
      <span>Yadav Technologies</span>
    </footer>

  </main>


  <!-- =========================================================
       GLOBAL MODAL
       ========================================================= -->

  <div
    id="modalOverlay"
    class="modal-overlay"
    style="display:none;"
  >

    <div
      id="modal"
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
    >

      <div class="modal-header">

        <h2 id="modalTitle">
          Modal
        </h2>

        <button
          id="modalClose"
          class="modal-close"
          type="button"
          aria-label="Close"
        >
          <svg
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>

      </div>


      <div
        id="modalBody"
        class="modal-body"
      ></div>


      <div
        id="modalFooter"
        class="modal-footer"
      >

        <button
          id="modalCancel"
          class="btn btn-secondary"
          type="button"
        >
          Cancel
        </button>

        <button
          id="modalConfirm"
          class="btn btn-primary"
          type="button"
        >
          Confirm
        </button>

      </div>

    </div>

  </div>


  <!-- =========================================================
       TOAST CONTAINER
       ========================================================= -->

  <div
    id="toastContainer"
    class="toast-container"
    aria-live="polite"
    aria-atomic="true"
  ></div>


  <!-- =========================================================
       GLOBAL LOADING
       ========================================================= -->

  <div
    id="loadingOverlay"
    class="loading-overlay"
    style="display:none;"
  >

    <div class="loading-box">

      <span class="loading-spinner"></span>

      <span>
        Loading...
      </span>

    </div>

  </div>


  <!-- =========================================================
       APPLICATION MODULES
       ========================================================= -->

  <script type="module" src="js/firebase.js"></script>

  <script type="module" src="js/app.js"></script>

  <script type="module" src="js/login.js"></script>

  <script type="module" src="js/dashboard.js"></script>

  <script type="module" src="js/students.js"></script>

  <script type="module" src="js/teachers.js"></script>

  <script type="module" src="js/fees.js"></script>

  <script type="module" src="js/salary.js"></script>

  <script type="module" src="js/analytics.js"></script>

  <script type="module" src="js/receipt.js"></script>

  <script type="module" src="js/export.js"></script>


  <!-- =========================================================
       MOBILE SIDEBAR CONTROL
       ========================================================= -->

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      const sidebar = document.getElementById('sidebar');
      const menuToggle = document.getElementById('menuToggle');
      const sidebarClose = document.getElementById('sidebarClose');
      const sidebarOverlay = document.getElementById('sidebarOverlay');

      function openSidebar() {
        sidebar?.classList.add('open');
        sidebarOverlay?.classList.add('active');

        if (sidebarOverlay) {
          sidebarOverlay.setAttribute('aria-hidden', 'false');
        }
      }

      function closeSidebar() {
        sidebar?.classList.remove('open');
        sidebarOverlay?.classList.remove('active');

        if (sidebarOverlay) {
          sidebarOverlay.setAttribute('aria-hidden', 'true');
        }
      }

      menuToggle?.addEventListener('click', openSidebar);
      sidebarClose?.addEventListener('click', closeSidebar);
      sidebarOverlay?.addEventListener('click', closeSidebar);

      document.querySelectorAll('.nav-link').forEach((link) => {
        link.addEventListener('click', () => {
          closeSidebar();
        });
      });

    });
  </script>

</body>
</html>
